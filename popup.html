<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Lồng tiếng Việt</title>
<style>
  :root { --red: #da251d; --gold: #ffcd00; --bg: #fff; --fg: #1f1f1f; --muted: #666; --line: #e6e6e6; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1e1e1e; --fg: #eee; --muted: #aaa; --line: #333; } }
  body { width: 320px; margin: 0; padding: 14px 16px 16px; background: var(--bg); color: var(--fg); font: 13px/1.4 "Segoe UI", Roboto, Arial, sans-serif; }
  h1 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  h1 .flag { width: 22px; height: 15px; background: var(--red); border-radius: 2px; display: inline-flex; align-items: center; justify-content: center; color: var(--gold); font-size: 11px; }
  #toggle { width: 100%; padding: 9px; border: 0; border-radius: 8px; background: var(--red); color: #fff; font-weight: 600; font-size: 14px; cursor: pointer; transition: background .2s; }
  #toggle.off { background: #555; }
  #status { color: var(--muted); margin: 6px 0 12px; min-height: 18px; font-size: 12px; }
  label { display: block; margin: 10px 0 0; }
  .row { display: flex; justify-content: space-between; }
  .val { color: var(--muted); font-variant-numeric: tabular-nums; }
  input[type=range], select { width: 100%; margin-top: 4px; }
  select { padding: 5px 8px; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; }
  .check { display: flex; gap: 8px; align-items: center; cursor: pointer; user-select: none; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0 6px; }
  #test { margin-top: 6px; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; font-size: 12px; }
  #test:hover { background: rgba(128, 128, 128, 0.1); }
  .ai-box { border: 1px dashed var(--line); border-radius: 8px; padding: 8px; margin-top: 8px; }
  .ai-box .btnrow { display: flex; gap: 6px; margin: 6px 0; }
  .ai-box button { flex: 1; padding: 6px 4px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; font-size: 11.5px; }
  .ai-box button:hover { background: rgba(128, 128, 128, 0.12); }
  .ai-box button.primary { background: #7c3aed; border-color: #7c3aed; color: #fff; font-weight: 700; }
  .ai-box textarea { width: 100%; box-sizing: border-box; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); font: 11.5px/1.5 inherit; padding: 6px; resize: vertical; }
  #aiStatus { font-size: 11.5px; color: var(--muted); margin-top: 4px; min-height: 14px; }
  #aiBadge { background: #7c3aed; color: #fff; font-size: 10px; padding: 0 6px; border-radius: 8px; }
  .tip { color: var(--muted); font-size: 11.5px; margin-top: 12px; line-height: 1.5; }
</style>
</head>
<body>
  <h1><span class="flag">★</span>Lồng tiếng Việt cho YouTube</h1>
  <button id="toggle" class="off">Bật lồng tiếng video này</button>
  <div id="status"></div>

  <label class="check"><input type="checkbox" id="autoStart"> Tự lồng tiếng khi mở video</label>
  <label class="check"><input type="checkbox" id="skipVietnamese"> Tự nhận diện và bỏ qua video tiếng Việt</label>
  <label class="check"><input type="checkbox" id="smartFilter"> Lọc tiếng nhạc và âm thanh không lời</label>
  <label class="check"><input type="checkbox" id="showSubs"> Hiện phụ đề tiếng Việt</label>
  <hr>
  <label>Giọng đọc
    <select id="voice"></select>
  </label>
  <label>Tone giọng (Pitch)
    <select id="pitch">
      <option value="-8">Trầm ấm (-8Hz)</option>
      <option value="0">Chuẩn (0Hz)</option>
      <option value="5">Thanh thoát (+5Hz)</option>
    </select>
  </label>
  <button id="test">▶ Nghe thử giọng</button>

  <label><div class="row"><span>Tốc độ đọc cơ bản</span><span class="val" id="rateVal"></span></div>
    <input type="range" id="rate" min="0.8" max="1.6" step="0.05"></label>
  <label><div class="row"><span>Âm gốc khi đang đọc</span><span class="val" id="duckSpeakingVal"></span></div>
    <input type="range" id="duckSpeaking" min="0" max="0.6" step="0.05"></label>
  <label><div class="row"><span>Âm gốc lúc nghỉ</span><span class="val" id="duckGapVal"></span></div>
    <input type="range" id="duckGap" min="0" max="1" step="0.05"></label>
  <label><div class="row"><span>Âm lượng lồng tiếng</span><span class="val" id="dubVolumeVal"></span></div>
    <input type="range" id="dubVolume" min="0.3" max="1" step="0.05"></label>

  <div class="ai-box">
    <b>Kịch bản AI riêng <span id="aiBadge" style="display:none">AI</span></b>
    <div style="color:var(--muted);font-size:11.5px;margin-top:2px">Bấm <b>Lấy prompt + sub gốc</b> → dán vào Gemini/ChatGPT → dán kết quả vào ô dưới → <b>Dùng bản AI</b>.</div>
    <div class="btnrow">
      <button id="getPrompt">Lấy prompt + sub gốc</button>
      <button id="clearAi">Xóa bản AI</button>
    </div>
    <textarea id="aiScript" rows="6" placeholder="Dán bản dịch AI vào đây (mỗi dòng 1 câu, hoặc SRT/VTT đều được)…"></textarea>
    <div class="btnrow"><button id="useAi" class="primary">Dùng bản AI này lồng tiếng</button></div>
    <div id="aiStatus"></div>
  </div>

  <div class="tip">Phím tắt: <b>Alt+V</b> hoặc nút <b>VI</b> trên trình phát.<br>Hỗ trợ giọng <b>Hoài My & Nam Minh (Tự nhiên)</b> chuẩn HD trên cả <b>Chrome</b> và <b>Edge</b>.</div>
  <script src="popup.js"></script>
</body>
</html>
